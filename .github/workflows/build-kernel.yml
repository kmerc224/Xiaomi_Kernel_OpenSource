name: Build Alioth Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel (alioth_user_defconfig)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      CLANG_PATH: ${{ github.workspace }}/toolchains/clang-r377782c
      GCC_PATH: ${{ github.workspace }}/toolchains/gcc-aarch64

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils git make bc bison openssl curl zip kmod cpio flex \
            libelf-dev libssl-dev libtfm-dev libc6-dev device-tree-compiler \
            ca-certificates python3 xz-utils build-essential rsync

      - name: Download AOSP Clang (clang-r377782c) from Google AOSP
        run: |
          echo "=== Downloading AOSP clang-r377782c from Google AOSP source ==="
          mkdir -p $CLANG_PATH
          SUCCESS=false

          # ===== Method 1: git clone with sparse checkout (partial clone) =====
          echo "--- Method 1: git clone with sparse checkout from mirror-goog-main-llvm-toolchain-source ---"
          rm -rf /tmp/clang-repo
          if git clone --depth=1 --no-tags --filter=blob:none --sparse \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86" \
              /tmp/clang-repo 2>&1; then
            cd /tmp/clang-repo
            if git sparse-checkout set clang-r377782c 2>&1; then
              if [ -d "clang-r377782c/bin" ]; then
                echo "Sparse checkout succeeded!"
                cp -r clang-r377782c/* $CLANG_PATH/
                SUCCESS=true
              else
                echo "sparse-checkout completed but clang-r377782c/bin not found"
                ls -la clang-r377782c/ 2>/dev/null || echo "directory empty or missing"
              fi
            else
              echo "Sparse checkout failed."
            fi
            cd ${{ github.workspace }}
          else
            echo "git clone failed."
          fi
          rm -rf /tmp/clang-repo

          # ===== Method 2: +archive/ download with curl =====
          if [ "$SUCCESS" != "true" ]; then
            echo ""
            echo "--- Method 2: Download +archive/ via curl from mirror-goog-main-llvm-toolchain-source ---"
            for attempt in 1 2 3; do
              echo "  curl attempt $attempt..."
              if curl -L --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 600 \
                  "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r377782c.tar.gz" \
                  -o /tmp/clang.tar.gz 2>&1; then
                if [ -s /tmp/clang.tar.gz ]; then
                  tar -xzf /tmp/clang.tar.gz -C $CLANG_PATH 2>/dev/null
                  if [ -f "$CLANG_PATH/bin/clang" ]; then
                    echo "  +archive/ download succeeded!"
                    SUCCESS=true
                    rm -f /tmp/clang.tar.gz
                    break
                  else
                    echo "  Archive extracted but clang binary not found. Archive may be invalid."
                    rm -rf $CLANG_PATH/*
                  fi
                fi
              fi
              rm -f /tmp/clang.tar.gz
              sleep 10
            done
          fi

          # ===== Method 3: Try android12-release branch =====
          if [ "$SUCCESS" != "true" ]; then
            echo ""
            echo "--- Method 3: git clone from android12-release branch ---"
            rm -rf /tmp/clang-repo
            if git clone --depth=1 --no-tags --filter=blob:none --sparse \
                "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86" \
                -b android12-release /tmp/clang-repo 2>&1; then
              cd /tmp/clang-repo
              # List available clang versions
              echo "Available clang versions in android12-release:"
              git ls-tree --name-only HEAD | grep clang || echo "  (none found via ls-tree)"
              cd ${{ github.workspace }}
            fi
            rm -rf /tmp/clang-repo
          fi

          if [ "$SUCCESS" != "true" ]; then
            echo ""
            echo "ERROR: Failed to download AOSP clang-r377782c from all methods."
            exit 1
          fi

          chmod +x $CLANG_PATH/bin/clang 2>/dev/null || true
          echo ""
          echo "=== Clang version ==="
          $CLANG_PATH/bin/clang --version

      - name: Download AOSP GCC aarch64 (4.9) from Google AOSP
        run: |
          echo "=== Downloading AOSP GCC aarch64-linux-android-4.9 from Google AOSP source ==="
          mkdir -p $GCC_PATH
          SUCCESS=false

          # ===== Method 1: git clone with sparse checkout =====
          echo "--- Method 1: git clone from android12-release ---"
          rm -rf /tmp/gcc-repo
          if git clone --depth=1 --no-tags \
              "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9" \
              -b android12-release /tmp/gcc-repo 2>&1; then
            echo "Clone succeeded. Copying GCC toolchain..."
            cp -r /tmp/gcc-repo/* $GCC_PATH/
            if [ -f "$GCC_PATH/bin/aarch64-linux-androidkernel-gcc" ] || [ -f "$GCC_PATH/bin/aarch64-linux-android-gcc" ]; then
              SUCCESS=true
              echo "GCC toolchain found."
            else
              echo "GCC binaries not found. Checking available binaries:"
              ls $GCC_PATH/bin/ 2>/dev/null | head -20
            fi
          fi
          rm -rf /tmp/gcc-repo

          # ===== Method 2: +archive/ with curl =====
          if [ "$SUCCESS" != "true" ]; then
            echo ""
            echo "--- Method 2: Download +archive/ via curl ---"
            for attempt in 1 2 3; do
              echo "  curl attempt $attempt..."
              if curl -L --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 600 \
                  "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android12-release.tar.gz" \
                  -o /tmp/gcc.tar.gz 2>&1; then
                if [ -s /tmp/gcc.tar.gz ]; then
                  tar -xzf /tmp/gcc.tar.gz -C $GCC_PATH 2>/dev/null
                  if ls $GCC_PATH/bin/*gcc* >/dev/null 2>&1; then
                    echo "  +archive/ download succeeded!"
                    SUCCESS=true
                    rm -f /tmp/gcc.tar.gz
                    break
                  fi
                fi
              fi
              rm -f /tmp/gcc.tar.gz
              sleep 10
            done
          fi

          if [ "$SUCCESS" != "true" ]; then
            echo "ERROR: Failed to download AOSP GCC from all methods."
            exit 1
          fi

          chmod +x $GCC_PATH/bin/aarch64-linux-androidkernel-gcc 2>/dev/null || true
          chmod +x $GCC_PATH/bin/aarch64-linux-android-gcc 2>/dev/null || true
          echo ""
          echo "=== GCC version ==="
          $GCC_PATH/bin/aarch64-linux-androidkernel-gcc --version 2>/dev/null || \
            $GCC_PATH/bin/aarch64-linux-android-gcc --version 2>/dev/null || \
            echo "GCC binary check failed"

      - name: Clone kernel source
        run: |
          echo "Cloning kernel source from MiCode/Xiaomi_Kernel_OpenSource (alioth-r-oss)..."
          git clone --depth=1 -b alioth-r-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git $KERNEL_DIR

      - name: Build kernel
        run: |
          cd $KERNEL_DIR

          # Build configuration from build.config.common + build.config.aarch64
          export ARCH=arm64
          export CC=$CLANG_PATH/bin/clang
          export LD=$CLANG_PATH/bin/ld.lld
          export NM=$CLANG_PATH/bin/llvm-nm
          export OBJCOPY=$CLANG_PATH/bin/llvm-objcopy
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=$GCC_PATH/bin/aarch64-linux-androidkernel-
          export PATH=$CLANG_PATH/bin:$GCC_PATH/bin:$PATH

          echo "========================================="
          echo "Build Configuration Summary"
          echo "========================================="
          echo "ARCH:          $ARCH"
          echo "CC:            $CC"
          echo "LD:            $LD"
          echo "CLANG_TRIPLE:  $CLANG_TRIPLE"
          echo "CROSS_COMPILE: $CROSS_COMPILE"
          echo "DEFCONFIG:     vendor/alioth_user_defconfig"
          echo "========================================="

          # Step 1: Apply defconfig
          echo "[1/3] Applying vendor/alioth_user_defconfig..."
          make O=out vendor/alioth_user_defconfig

          # Step 2: Build kernel image + modules
          echo "[2/3] Building kernel image and modules..."
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=$CC \
            LD=$LD \
            NM=$NM \
            OBJCOPY=$OBJCOPY \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE

          # Step 3: Install modules
          echo "[3/3] Installing modules..."
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=$CC \
            LD=$LD \
            NM=$NM \
            OBJCOPY=$OBJCOPY \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            INSTALL_MOD_PATH=./out/modules \
            INSTALL_MOD_STRIP=1 \
            modules_install

          echo "Build completed successfully!"

      - name: Collect build artifacts
        if: always()
        run: |
          mkdir -p ${{ github.workspace }}/output

          # Kernel image
          if [ -f $KERNEL_DIR/out/arch/arm64/boot/Image.gz ]; then
            cp $KERNEL_DIR/out/arch/arm64/boot/Image.gz ${{ github.workspace }}/output/
            echo "Image.gz: $(ls -lh $KERNEL_DIR/out/arch/arm64/boot/Image.gz)"
          fi

          # vmlinux
          if [ -f $KERNEL_DIR/out/vmlinux ]; then
            cp $KERNEL_DIR/out/vmlinux ${{ github.workspace }}/output/
            echo "vmlinux: $(ls -lh $KERNEL_DIR/out/vmlinux)"
          fi

          # System.map
          if [ -f $KERNEL_DIR/out/System.map ]; then
            cp $KERNEL_DIR/out/System.map ${{ github.workspace }}/output/
          fi

          # Kernel config
          if [ -f $KERNEL_DIR/out/.config ]; then
            cp $KERNEL_DIR/out/.config ${{ github.workspace }}/output/
          fi

          # Kernel modules
          if [ -d $KERNEL_DIR/out/modules ]; then
            cp -r $KERNEL_DIR/out/modules ${{ github.workspace }}/output/
          fi

          # List all .ko modules
          echo ""
          echo "=== Built kernel modules ==="
          find $KERNEL_DIR/out -name "*.ko" | head -50
          echo "Total modules: $(find $KERNEL_DIR/out -name '*.ko' | wc -l)"

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alioth-kernel-output
          path: ${{ github.workspace }}/output/
          if-no-files-found: warn
